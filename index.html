<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог товаров</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <img src="images/лого.png" />
        </div>
        <nav class="nav">
          <a href="#">Главная</a>
          <a href="#">Каталог</a>
          <a href="#">О нас</a>
          <a href="#">Контакты</a>
        </nav>
        <button class="button-cart">Корзина</button>
      </div>
    </header>

    <div class="image-background">
      <h1 class="title">Выбери свой продукт</h1>
      <button id="change-color-all-card-button">
        Смена цвета всех карточек
      </button>
      <button id="change-color-first-card-button">
        Смена цвета первой карточки
      </button>
      <button id="open-google">Открыть Google</button>
      <button id="output-console-log">Вывести сообщение в консоль лог</button>
      <ul class="products clear-list" id="products-list"></ul>
    </div>
    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
  </body>
</html>
