<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог товаров</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <img src="images/лого.png" />
        </div>
        <nav class="nav">
          <a href="#">Главная</a>
          <a href="#">Каталог</a>
          <a href="#">О нас</a>
          <a href="#">Контакты</a>
        </nav>
        <button class="button-cart">Корзина</button>
        <button class="button-register">Регистрация</button>
      </div>
    </header>

    <div class="image-background">
      <h1 class="title">Выбери свой продукт</h1>
      <button id="change-color-all-card-button">
        Смена цвета всех карточек
      </button>
      <button id="change-color-first-card-button">
        Смена цвета первой карточки
      </button>
      <button id="open-google">Открыть Google</button>
      <button id="output-console-log">Вывести сообщение в консоль лог</button>
      <ul
        class="products products-row-1 clear-list"
        id="products-container"
      ></ul>
    </div>

    <template id="product-card-template">
      <li class="card">
        <img class="card__image" src="" alt="" />
        <p class="card__skin-type"></p>
        <h2 class="card__product-name"></h2>
        <p class="card__description"></p>
        <span class="card__compound-list">Состав:</span>
        <ul class="card__compound-text"></ul>
        <div class="card__price-line">
          <span class="card__price">Цена:</span>
          <span class="card__price-value"></span>
        </div>
      </li>
    </template>

    <script type="module" src="main1.js"></script>

    <footer class="footer">
      <div class="footer-container">
        <nav class="footer-nav">
          <a href="#">Главная</a>
          <a href="#">Каталог</a>
          <a href="#">О нас</a>
          <a href="#">Контакты</a>
        </nav>
        <div class="footer-subscribe">
          <p class="subscribe-title">Подпишитесь на наши новости</p>
          <form id="subscribe-form" class="subscribe-form">
            <input
              type="email"
              id="subscribe-email"
              placeholder="Введите ваш email"
              required
            />
            <button type="submit">Подписаться</button>
          </form>
        </div>
      </div>
    </footer>

    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="registerModal">
      <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <h2>Регистрация</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="firstName">Имя</label>
            <input
              type="text"
              id="firstName"
              placeholder="Введите имя"
              required
            />
          </div>
          <div class="form-group">
            <label for="surName">Фамилия</label>
            <input
              type="text"
              id="surName"
              placeholder="Введите фамилию"
              required
            />
          </div>
          <div class="form-group">
            <label for="birthday">Дата рождения</label>
            <input
              type="date"
              id="birthday"
              placeholder="Введите дату рождения"
              required
            />
          </div>
          <div class="form-group">
            <label for="login">Логин</label>
            <input
              type="text"
              id="login"
              placeholder="Введите логин"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Пароль</label>
            <input
              type="password"
              id="password"
              placeholder="Введите пароль"
              required
            />
          </div>
          <div class="form-group">
            <label for="repeatPassword">Повтор пароля</label>
            <input
              type="password"
              id="repeatPassword"
              placeholder="Повторите пароль"
              required
            />
          </div>

          <button type="submit">Зарегистрироваться</button>
        </form>
      </div>
    </div>
  </body>
</html>
